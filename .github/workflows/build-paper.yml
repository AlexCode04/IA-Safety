name: Build bilingual paper

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/**"
      - "scripts/generate_policy_macros.py"
      - ".github/workflows/build-paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "scripts/generate_policy_macros.py"
      - ".github/workflows/build-paper.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-bibtex-extra

      - name: Compile English paper
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main_en.tex

      - name: Compile Spanish paper
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main_es.tex

      - name: Collect PDFs
        run: |
          mkdir -p build/paper
          cp paper/main_en.pdf build/paper/BUDGET-NLA_EN.pdf
          cp paper/main_es.pdf build/paper/BUDGET-NLA_ES.pdf

      - name: Upload bilingual PDFs
        uses: actions/upload-artifact@v4
        with:
          name: BUDGET-NLA-papers
          path: build/paper/*.pdf
          if-no-files-found: error
          retention-days: 30
